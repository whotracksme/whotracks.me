[project]
name = "whotracks"
version = "2026.4.1"
description = "Learn about tracking technologies, market structure and data-sharing on the web"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
  "aiohttp==3.14.5",
  "certifi==2026.10.23",
  "chardet==7.7.0",
  "colour==0.1.5",
  "docopt-ng==0.9.0",
  "feedgen==1.0.0",
  "idna==3.20",
  "jinja2==3.1.6",
  "markdown==3.11.3",
  "markupsafe==3.0.4",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.6",
  "requests==2.34.2",
  "sanic==25.12.1",
  "six==1.17.0",
  "squarify==0.4.5",
  "urllib3==2.8.0",
  "wheel==0.48.0",
  "simplejson==4.2.0",
  "plotly==7.1.0",
  "async-timeout==5.0.1",
  "boto3==1.43.125",
  "watchdog==7.1.0",
  "libsass==0.23.0",
]

[project.scripts]
whotracksme = "whotracksme.main:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["whotracksme*"]
exclude = ["_site", "blog", "contrib", "data", "static", "templates", "tests"]
